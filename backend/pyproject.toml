[project]
name = "tripmind-api"
version = "0.1.0"
description = "TripMind booking platform API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "pyyaml>=6.0",
    "pandas>=3.1.1",
    "rapidfuzz>=3.14.6",
    "python-multipart>=0.0.33",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "import-linter>=2.1",
    "pandas-stubs>=3.1.0.261029",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "ASYNC"]
ignore = [
    "B008",  # FastAPI dependency injection uses calls in defaults
    "N818",  # domain errors are named for the condition (NotFound, Conflict), not "...Error"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]
"app/datagen/**" = ["S311"]  # seeded randomness for synthetic data, not security

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "app.main : app.cli : app.models",
    "app.modules.recovery",
    "app.modules.bookings | app.modules.planner",
    "app.modules.ingestion | app.datagen | app.modules.search | app.modules.inventory | app.modules.notifications",
    "app.modules.auth | app.modules.meta | app.modules.catalog | app.modules.operations",
    "app.modules.audit",
    "app.db",
    "app.core",
]
