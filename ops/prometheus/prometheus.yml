# Scrapes the API's /metrics (internal network only; never exposed through the web proxy).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tripmind-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: tripmind-worker
    static_configs:
      - targets: ["worker:9100"]
