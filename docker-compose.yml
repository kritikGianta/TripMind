name: tripmind

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tripmind}:${POSTGRES_PASSWORD:-tripmind}@db:5432/${POSTGRES_DB:-tripmind}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
  DEMO_TRAVELER_EMAIL: ${DEMO_TRAVELER_EMAIL:-demo@tripmind.dev}
  DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@tripmind.dev}
  CONFIG_DIR: /config
  MODELS_DIR: /models
  REDIS_URL: redis://redis:6379/0
  # Set to http://jaeger:4318 (with the obs profile) to send traces to Jaeger.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  # Optional hosted LLM keys; AI features fall back to rules without them.
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-groq,gemini,openrouter}

services:
  # Shared state for API replicas and the worker (rate limits, AI cache, job locks).
  # Business data stays in PostgreSQL; losing Redis only loses caches and counters.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripmind}
      POSTGRES_DB: ${POSTGRES_DB:-tripmind}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: apply migrations, seed demo accounts and, on first start, import the synthetic demo
  # dataset through the normal ingestion pipeline. Set BOOTSTRAP_DEMO_DATA=false to skip it.
  migrate:
    # Same image as `api` (built once by the api service), so migrations always match the code.
    image: tripmind-api:local
    pull_policy: never
    command:
      - sh
      - -c
      - >-
        alembic upgrade head && python -m app.cli seed &&
        if [ "$${BOOTSTRAP_DEMO_DATA:-true}" = "true" ]; then python -m app.cli data bootstrap; fi
    environment:
      <<: *api-env
      BOOTSTRAP_DEMO_DATA: ${BOOTSTRAP_DEMO_DATA:-true}
    volumes:
      - ./config:/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    image: tripmind-api:local
    environment:
      <<: *api-env
      BACKGROUND_JOBS: "false"  # the worker service runs scheduled jobs
    volumes:
      - ./config:/config:ro
      - ./docs/help:/docs/help:ro
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Scheduled jobs (hold expiry, price alerts, ...). Same image as the API.
  worker:
    image: tripmind-api:local
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    healthcheck:  # the worker has no API; its metrics endpoint shows it is alive
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    volumes:
      - ./config:/config:ro
      - ./models:/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Optional monitoring stack: docker compose --profile obs up -d ──────────────────────────────
  # The app never depends on these. Grafana: http://localhost:3001 (anonymous viewer),
  # Prometheus: http://localhost:9090, Jaeger: http://localhost:16686.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["obs"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-tripmind}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tripmind-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["obs"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

volumes:
  pgdata:
  grafana:
