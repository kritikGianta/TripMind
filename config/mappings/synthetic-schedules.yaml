# The synthetic dataset with flights supplied as airline schedules (repeating rows), as many real
# schedule feeds are. Generate it with:
#   python -m app.cli data generate --flight-format schedules --out ../data/generated/schedules.zip
# Each schedule row is expanded into dated flights at import (rules.yaml: schedule_horizon_days).

dataset: synthetic-schedules
origin: synthetic
description: Demo data with flight schedules instead of dated flights.

entities:
  airports:
    file: airports.csv
    fields: {code: iata, name: airport_name, city: city, country: country, latitude: lat,
             longitude: lon, timezone: tz}

  flights:
    file: flight_schedules.csv
    fields:
      flight_number: flight_no
      airline_code: airline_code
      airline_name: airline
      origin: from
      destination: to
      departure_clock: {column: dep, format: "%H:%M"}
      arrival_clock: {column: arr, format: "%H:%M"}
      duration_minutes: duration
      operating_days: days
      valid_from: {column: valid_from, format: "%Y-%m-%d"}
      valid_to: {column: valid_to, format: "%Y-%m-%d"}
      cabin_class: cabin
      fare: fare
      currency: currency
      aircraft: aircraft
      seat_capacity: seats

  hotels:
    file: hotels.csv
    fields:
      source_key: hotel_id
      name: name
      city: city
      country: country
      address: address
      latitude: lat
      longitude: lng
      star_rating: stars
      guest_rating: {column: rating, scale: 2}
      review_count: reviews
      amenities: {column: amenities, split: "|"}
      check_in_time: checkin
      check_out_time: checkout
      nightly_rate: price_per_night
      currency: currency
      total_rooms: total_rooms
      description: description

  room_types:
    file: rooms.csv
    fields: {source_key: room_id, hotel_key: hotel_id, name: room_name, max_occupancy: max_guests,
             bed_type: bed, nightly_rate: price, currency: currency, total_rooms: rooms_count,
             refundable: refundable, board: meal_plan}
