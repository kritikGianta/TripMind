# Hosted LLM providers, tried in the order given by LLM_PROVIDER_ORDER (default below).
# All three speak the OpenAI chat-completions protocol. Keys come from the environment only.
# A provider without a key is skipped; one that rate-limits or fails is skipped for
# `cooldown_seconds`. When none answers, every AI feature falls back to rules.

order: [groq, gemini, openrouter]
timeout_seconds: 12
cooldown_seconds: 60
cache_ttl_seconds: 900
max_output_tokens: 700

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    key_env: GROQ_API_KEY
    json_mode: true
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.5-flash-lite  # fast and correct in tests; 2.5-flash is closed to new keys and 3.8-flash was overloaded (7 Nov 2026)
    key_env: GEMINI_API_KEY
    json_mode: true
  openrouter:
    base_url: https://openrouter.ai/api/v1
    model: google/gemma-4-31b-it:free
    key_env: OPENROUTER_API_KEY
    json_mode: true
